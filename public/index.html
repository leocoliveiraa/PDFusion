<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDFusion - Resumo Inteligente de PDFs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0a0a0a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #fff;
      }

      .container {
        background: #fff;
        padding: 60px;
        max-width: 700px;
        width: 100%;
        border: 1px solid #e5e5e5;
      }

      .header {
        margin-bottom: 48px;
      }

      .logo {
        font-size: 24px;
        font-weight: 600;
        color: #000;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
      }

      .subtitle {
        color: #737373;
        font-size: 15px;
        line-height: 1.5;
        font-weight: 400;
      }

      .upload-area {
        border: 1px solid #e5e5e5;
        padding: 48px 24px;
        text-align: center;
        transition: border-color 0.2s;
        cursor: pointer;
        background: #fafafa;
        margin-bottom: 24px;
      }

      .upload-area:hover {
        border-color: #000;
      }

      .upload-area.dragover {
        border-color: #000;
        background: #f5f5f5;
      }

      .upload-text {
        font-size: 15px;
        color: #000;
        margin-bottom: 6px;
        font-weight: 500;
      }

      .upload-hint {
        font-size: 13px;
        color: #737373;
      }

      input[type="file"] {
        display: none;
      }

      .file-info {
        display: none;
        background: #fafafa;
        padding: 16px 20px;
        margin-bottom: 24px;
        align-items: center;
        gap: 12px;
        border: 1px solid #e5e5e5;
      }

      .file-info.show {
        display: flex;
      }

      .file-details {
        flex: 1;
      }

      .file-name {
        font-weight: 500;
        color: #000;
        margin-bottom: 4px;
        font-size: 14px;
      }

      .file-size {
        font-size: 13px;
        color: #737373;
      }

      .remove-file {
        background: none;
        border: none;
        color: #737373;
        cursor: pointer;
        padding: 4px;
        width: auto;
        transition: color 0.2s;
        display: flex;
        align-items: center;
      }

      .remove-file:hover {
        color: #000;
      }

      .remove-file svg {
        display: block;
      }

      button {
        width: 100%;
        padding: 14px;
        background: #000;
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: background 0.2s;
        letter-spacing: -0.2px;
      }

      button:hover:not(:disabled) {
        background: #1a1a1a;
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .loading {
        display: none;
        text-align: center;
        margin-top: 32px;
      }

      .loading.show {
        display: block;
      }

      .spinner {
        border: 2px solid #e5e5e5;
        border-top: 2px solid #000;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 12px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        color: #737373;
        font-size: 13px;
      }

      .result {
        display: none;
        margin-top: 40px;
        padding-top: 40px;
        border-top: 1px solid #e5e5e5;
      }

      .result.show {
        display: block;
      }

      .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .result-title {
        font-size: 16px;
        font-weight: 600;
        color: #000;
        letter-spacing: -0.3px;
      }

      .copy-btn {
        background: #fafafa;
        color: #000;
        padding: 8px 16px;
        font-size: 13px;
        width: auto;
        border: 1px solid #e5e5e5;
      }

      .copy-btn:hover {
        background: #f5f5f5;
      }

      .result-content {
        background: #fafafa;
        padding: 24px;
        border: 1px solid #e5e5e5;
        white-space: pre-wrap;
        line-height: 1.7;
        color: #171717;
        font-size: 14px;
      }

      .error {
        background: #fef2f2;
        border-color: #fecaca;
        color: #991b1b;
      }

      @media (max-width: 640px) {
        .container {
          padding: 40px 24px;
        }

        .logo {
          font-size: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <div class="logo">PDFusion</div>
        <p class="subtitle">
          Resumos inteligentes de PDFs com IA
        </p>
      </div>

      <div class="upload-area" id="uploadArea" onclick="document.getElementById('pdfFile').click()">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin: 0 auto 12px; display: block; color: #737373;">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
        <div class="upload-text">Selecionar arquivo</div>
        <div class="upload-hint">PDF até 10MB</div>
      </div>

      <input
        type="file"
        id="pdfFile"
        accept="application/pdf"
        onchange="handleFileSelect(event)"
      />

      <div class="file-info" id="fileInfo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="flex-shrink: 0; color: #737373;">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <div class="file-details">
          <div class="file-name" id="fileName"></div>
          <div class="file-size" id="fileSize"></div>
        </div>
        <button class="remove-file" onclick="removeFile()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <button id="uploadBtn" onclick="uploadPDF()" disabled>
        Gerar resumo
      </button>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Processando...</div>
      </div>

      <div class="result" id="result">
        <div class="result-header">
          <div class="result-title">Resumo</div>
          <button class="copy-btn" onclick="copyToClipboard()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Copiar
          </button>
        </div>
        <div class="result-content" id="resultContent"></div>
      </div>
    </div>

    <script>
      let selectedFile = null;

      // Drag and drop
      const uploadArea = document.getElementById("uploadArea");

      uploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadArea.classList.add("dragover");
      });

      uploadArea.addEventListener("dragleave", () => {
        uploadArea.classList.remove("dragover");
      });

      uploadArea.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadArea.classList.remove("dragover");
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          document.getElementById("pdfFile").files = files;
          handleFileSelect({ target: { files } });
        }
      });

      function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        if (file.type !== "application/pdf") {
          alert("Por favor, selecione um arquivo PDF válido.");
          return;
        }

        if (file.size > 10 * 1024 * 1024) {
          alert("Arquivo muito grande. O limite é 10MB.");
          return;
        }

        selectedFile = file;
        document.getElementById("fileName").textContent = file.name;
        document.getElementById("fileSize").textContent = formatFileSize(
          file.size
        );
        document.getElementById("fileInfo").classList.add("show");
        document.getElementById("uploadBtn").disabled = false;
        document.getElementById("result").classList.remove("show");
      }

      function removeFile() {
        selectedFile = null;
        document.getElementById("pdfFile").value = "";
        document.getElementById("fileInfo").classList.remove("show");
        document.getElementById("uploadBtn").disabled = true;
      }

      function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      }

      async function uploadPDF() {
        if (!selectedFile) {
          alert("Selecione um arquivo PDF!");
          return;
        }

        const uploadBtn = document.getElementById("uploadBtn");
        const loading = document.getElementById("loading");
        const result = document.getElementById("result");
        const resultContent = document.getElementById("resultContent");

        uploadBtn.disabled = true;
        loading.classList.add("show");
        result.classList.remove("show");

        try {
          const arrayBuffer = await selectedFile.arrayBuffer();
          const uint8 = new Uint8Array(arrayBuffer);
          let binary = "";
          const chunkSize = 0x8000;
          for (let i = 0; i < uint8.length; i += chunkSize) {
            binary += String.fromCharCode.apply(
              null,
              Array.prototype.slice.call(uint8, i, i + chunkSize)
            );
          }
          const base64 = btoa(binary);

          const res = await fetch("/api/upload", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              filename: selectedFile.name,
              data: base64,
            }),
          });

          const data = await res.json();

          loading.classList.remove("show");
          result.classList.add("show");

          if (res.ok && data.summary) {
            resultContent.textContent = data.summary;
            resultContent.classList.remove("error");
          } else {
            resultContent.textContent =
              "❌ Erro: " + (data.error || JSON.stringify(data));
            resultContent.classList.add("error");
          }
        } catch (err) {
          loading.classList.remove("show");
          result.classList.add("show");
          resultContent.textContent =
            "❌ Erro ao processar: " + (err.message || err);
          resultContent.classList.add("error");
        } finally {
          uploadBtn.disabled = false;
        }
      }

      function copyToClipboard() {
        const content = document.getElementById("resultContent").textContent;
        navigator.clipboard.writeText(content).then(() => {
          const btn = document.querySelector(".copy-btn");
          const originalText = btn.textContent;
          btn.textContent = "✓ Copiado!";
          setTimeout(() => {
            btn.textContent = originalText;
          }, 2000);
        });
      }
    </script>
  </body>
</html>
